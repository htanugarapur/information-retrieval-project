<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Synapse — does the explanation cause the ranking? An edge is deleted and the candidate falls from rank 3 to rank 17.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f0ea"/>
      <stop offset="0.6" stop-color="#edeae2"/>
      <stop offset="1" stop-color="#e4dfd4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ccba9c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9b7b50" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0 0 L7 3.2 L0 6.4 z" fill="#9b7b50"/>
    </marker>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="3" fill="#9b7b50"/>

  <text x="76" y="112" font-family="'Outfit','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="4.4" fill="#9b7b50" font-weight="500">E X P L A N A T I O N &#160; F A I T H F U L N E S S</text>
  <text x="76" y="192" font-family="'Cormorant Garamond',Georgia,'Iowan Old Style','Palatino Linotype',serif" font-size="78" fill="#141208" letter-spacing="1.5">Synapse</text>
  <rect x="76" y="220" width="104" height="2" fill="#9b7b50"/>
  <text x="76" y="266" font-family="'Cormorant Garamond',Georgia,'Iowan Old Style',serif" font-size="29" font-style="italic" fill="#4a4436">Does the explanation cause the ranking?</text>
  <text x="76" y="306" font-family="'Outfit','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#716d60">Delete exactly the edges it cited. Re-rank. Compare against a random-edge control.</text>

  <!-- the protocol, drawn: one cited edge is cut and the candidate falls -->
  <g transform="translate(742,44)">
    <g stroke="#9b7b50" fill="none" stroke-linecap="round" stroke-opacity="0.38" stroke-width="1.25">
      <path d="M60 76 L146 96"/>
      <path d="M146 96 L120 172"/>
      <path d="M120 172 L44 196"/>
      <path d="M146 96 L214 60"/>
      <path d="M44 196 L96 244"/>
    </g>
    <!-- the cited edge, severed -->
    <path d="M120 172 L214 214" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 8" stroke-linecap="round" fill="none"/>
    <g stroke="#c0392b" stroke-width="2.2" stroke-linecap="round">
      <path d="M160 182 L176 204"/>
      <path d="M176 182 L160 204"/>
    </g>
    <g fill="#9b7b50">
      <circle cx="60" cy="76" r="6.5" fill-opacity="0.8"/>
      <circle cx="146" cy="96" r="9"/>
      <circle cx="214" cy="60" r="5" fill-opacity="0.7"/>
      <circle cx="120" cy="172" r="7.5" fill-opacity="0.85"/>
      <circle cx="44" cy="196" r="5.5" fill-opacity="0.7"/>
      <circle cx="96" cy="244" r="5" fill-opacity="0.6"/>
    </g>
    <circle cx="214" cy="214" r="10" fill="none" stroke="#c0392b" stroke-width="2"/>

    <!-- rank displacement -->
    <text x="286" y="150" font-family="'Outfit','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#716d60" letter-spacing="1.6">B A S E L I N E</text>
    <text x="286" y="196" font-family="Georgia,serif" font-size="40" fill="#141208">r&#8320; = 3</text>
    <path d="M286 224 L406 224" stroke="#9b7b50" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="286" y="256" font-family="'Outfit','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#716d60" letter-spacing="1.6">A B L A T E D</text>
    <text x="286" y="302" font-family="Georgia,serif" font-size="40" fill="#c0392b">r&#8321; = 17</text>
  </g>
</svg>
